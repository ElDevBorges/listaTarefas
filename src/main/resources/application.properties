spring.application.name=tarefas

#endereço do banco
spring.datasource.url=${SPRING_URL}
#Usuario e senha
spring.datasource.username=${SPRING_USERNAME}
spring.datasource.password=${SPRING_PASSWORD}

#Criaçao automatica das tabelas
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true



#Formatar os comandos SQL
spring.jpa.properties.hibernate.format_sql=true

